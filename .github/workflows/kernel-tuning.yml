name: Kernel tuning CPU contracts
on: [push, pull_request]
jobs:
  kernel-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e 'extensions/kernel_tuning[test]'
      - run: python -m pytest -q extensions/kernel_tuning/tests
      # CUDA skips are explicit: this job does not validate GPU kernels or speedups.
