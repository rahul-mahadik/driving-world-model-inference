[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drivebench-kernel-tuning"
version = "0.3.0"
description = "Reproducible GPU benchmarks and a budgeted configuration-search environment"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "gymnasium==1.2.3"]

[project.optional-dependencies]
gpu = ["torch==2.10.0", "triton==3.6.0; sys_platform == 'linux'"]
test = ["pytest>=8,<9", "torch==2.10.0"]
interface-test = ["pytest>=8,<9"]

[project.scripts]
drivebench-tune = "drivebench_tuning.cli:main"
drivebench-search = "drivebench_tuning.search_cli:main"
drivebench-agent-demo = "drivebench_tuning.agent_demo:main"
drivebench-vista-batch = "drivebench_tuning.vista_batch:main"
drivebench-vista-metrics = "drivebench_tuning.agent_metrics_worker:main"
drivebench-agent-trials = "drivebench_tuning.agent_trials:main"
drivebench-agent-artifacts = "drivebench_tuning.agent_artifacts:main"

[tool.setuptools.packages.find]
include = ["drivebench_tuning*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires an NVIDIA CUDA GPU and Triton"]

[tool.setuptools.package-data]
drivebench_tuning = ["suites/*.json"]
