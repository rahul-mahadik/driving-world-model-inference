extends: study_probe_denoiser_dynamic.yaml
name: study-registered-einops-dynamic-limit512
output: outputs/study-probes/registered-einops-dynamic-limit512
compiler_runtime:
  kind: official_einops_registration_with_explicit_dynamo_cache_limit
  einops_version: 0.6.1
  registration_api: einops._torch_specific.allow_ops_in_compiled_graph
