# CUDA 11.8 / native sm90 compatibility environment; original binaries failed on H100.
# Exploratory repetition of one verified development clip; never headline evidence.
extends: preflight_scene0103.yaml
name: preflight-scene0103-eager-exploratory
output: /workspace/outputs/preflight-scene0103-benchmark
numerical_validation: /workspace/outputs/preflight-scene0103/strict-agreement.json
benchmark:
  workload: single_future
  candidate_count: 1
  requests: 3
  warmup_requests: 2
  # Explicit cap gives exactly two warmups for this eager configuration.
  max_warmup_requests: 2
  input_condition: uncached
  # Retain only the first measured clip; timing repeats use the same clip/seed.
  save_outputs: 1
  headline: false
preflight:
  scope: three exploratory timing repeats of one development clip after two warmups
  headline_eligible: false
  quality_validated: false
